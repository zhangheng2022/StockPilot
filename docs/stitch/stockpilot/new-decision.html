<body class="font-body-md text-body-md overflow-x-hidden">
<!-- Top Navigation Anchor -->
<header class="bg-background dark:bg-background docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-margin-mobile h-16 max-w-7xl mx-auto">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="monitoring">monitoring</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">StockPilot AI</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant p-2 rounded-full hover:bg-surface-container-low transition-all" data-icon="close">close</button>
</div>
</header>
<!-- Main Wizard Canvas -->
<main class="max-w-3xl mx-auto px-margin-mobile pt-stack-lg pb-32">
<!-- Step Progress Indicator -->
<div class="mb-12">
<div class="flex justify-between relative">
<!-- Progress Line -->
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-outline-variant -translate-y-1/2 z-0"></div>
<!-- Step 1: Done -->
<div class="relative z-10 flex flex-col items-center gap-2 group">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-label-caps font-data-display ring-4 ring-background">
<span class="material-symbols-outlined text-sm" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant">基础信息</span>
</div>
<!-- Step 2: Active -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-10 h-10 -mt-1 rounded-full bg-primary-container text-white flex items-center justify-center text-label-caps font-data-display ring-4 ring-background shadow-sm">
                        2
                    </div>
<span class="font-label-caps text-label-caps text-primary font-bold">理由依据</span>
</div>
<!-- Step 3: Pending -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-outline flex items-center justify-center text-label-caps font-data-display ring-4 ring-background">
                        3
                    </div>
<span class="font-label-caps text-label-caps text-outline">风险仓位</span>
</div>
<!-- Step 4: Pending -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-outline flex items-center justify-center text-label-caps font-data-display ring-4 ring-background">
                        4
                    </div>
<span class="font-label-caps text-label-caps text-outline">退出条件</span>
</div>
</div>
</div>
<!-- Focused Entry Area -->
<div class="space-y-stack-lg">
<!-- Section: Selected Asset -->
<section class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant/30">
<label class="block font-label-caps text-label-caps text-outline mb-2">已选标的</label>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="show_chart">show_chart</span>
</div>
<div>
<h2 class="font-headline-sm text-headline-sm text-on-background">腾讯控股</h2>
<p class="font-data-display text-label-caps text-outline">HK.00700</p>
</div>
</div>
<button class="text-primary hover:underline text-body-md font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span> 修改
                    </button>
</div>
</section>
<!-- Section: Decision Logic -->
<section class="space-y-4">
<div class="flex items-center justify-between">

</div>

<div class="absolute bottom-4 right-4 flex items-center gap-2 opacity-40 group-focus-within:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary cursor-help" data-icon="auto_awesome" title="AI 辅助润色逻辑">auto_awesome</span>
</div>
</div>
<p class="text-outline text-body-md italic">
                    “卓越的交易者不仅记录‘买什么’，更清晰地记录‘为什么买’。”
                </p>
</section>
<!-- Section: Evidence & Links -->
<section class="space-y-4 pt-4">
<h3 class="font-headline-md text-headline-md text-on-background">依据与证据</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">

</div>

</div>
</div>
</section>
<!-- AI Inspection Tip (Subtle) -->
<div class="p-4 bg-primary/5 border border-primary/10 rounded-lg flex gap-4 items-start">

<div class="space-y-1">

</div>
</div>

</button>
</div>
</div>

<!-- Atmosphere Micro-interaction script -->
<script>
        // Subtle focus effects for the textarea
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('focus', () => {
            document.body.classList.add('bg-neutral');
        });
        textarea.addEventListener('blur', () => {
            document.body.classList.remove('bg-neutral');
        });

        // Basic step simulation logic (UI only)
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ripple = document.createElement('span');
                ripple.classList.add('absolute', 'bg-white/20', 'rounded-full', 'animate-ping');
                ripple.style.width = '100px';
                ripple.style.height = '100px';
                ripple.style.left = `${e.clientX - 50}px`;
                ripple.style.top = `${e.clientY - 50}px`;
                // This is a simplified effect for button feedback
            });
        });
    </script>
